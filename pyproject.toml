[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archiveflow"
version = "0.1.0"
description = "A local-first organizer for media in a downloaded social-media export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ArchiveFlow contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
archiveflow = "archiveflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
